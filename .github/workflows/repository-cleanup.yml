name: Repository cleanup and workflow verification

on:
  workflow_dispatch:
  push:
    branches:
      - production
    paths:
      - ".github/workflows/repository-cleanup.yml"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: repository-cleanup-production
  cancel-in-progress: false

jobs:
  cleanup:
    name: Verify production, refresh profile, and remove stale branches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out production with full history
        uses: actions/checkout@v6
        with:
          ref: production
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q profile_generator tests

      - name: Validate production artifacts and repository contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import struct
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('.')
          required = (
              root / 'README.md',
              root / 'assets/profile-dark.svg',
              root / 'assets/profile-light.svg',
              root / 'assets/profile-banner.png',
              root / 'generated/profile-stats.json',
              root / 'profile_generator/portrait.py',
              root / '.github/workflows/profile-stats.yml',
          )
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f'missing required production files: {missing}')

          forbidden = (
              root / 'assets/ascii-portrait.txt',
              root / '.profile-update',
              root / '.profile-finalize',
              root / 'docs/superpowers',
              root / '.github/workflows/apply-profile-v2.yml',
              root / '.github/workflows/apply-profile-final.yml',
          )
          present = [str(path) for path in forbidden if path.exists()]
          if present:
              raise SystemExit(f'temporary or superseded files remain: {present}')

          for path in (root / 'assets/profile-dark.svg', root / 'assets/profile-light.svg'):
              svg = ET.parse(path).getroot()
              if svg.tag.rsplit('}', 1)[-1] != 'svg':
                  raise SystemExit(f'{path} does not have an SVG root')

          banner = (root / 'assets/profile-banner.png').read_bytes()
          if banner[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('profile banner is not a PNG')
          width, height = struct.unpack('>II', banner[16:24])
          if (width, height) != (917, 512):
              raise SystemExit(f'unexpected profile banner dimensions: {width}x{height}')

          payload = json.loads((root / 'generated/profile-stats.json').read_text(encoding='utf-8'))
          if payload.get('schema_version') != 2:
              raise SystemExit('generated profile schema is not version 2')
          if payload.get('coverage') not in {'COMPLETE', 'INVENTORY_COMPLETE_ACTIVITY_PENDING'}:
              raise SystemExit('generated profile coverage is invalid')
          if payload.get('repositories', {}).get('total', 0) < 1:
              raise SystemExit('generated repository inventory is empty')

          readme = (root / 'README.md').read_text(encoding='utf-8')
          if 'assets/profile-banner.png' not in readme:
              raise SystemExit('README does not reference the profile footer banner')
          if 'lucifer@rodstark :: LUCY-ARCH-01' in readme:
              raise SystemExit('superseded terminal identifier remains in README')
          PY
          git diff --check
          if git grep -nE '(github[_]pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,})'; then
            echo "A GitHub access-token pattern was found in tracked content." >&2
            exit 1
          fi

      - name: Verify issue and pull-request backlogs are empty
        shell: bash
        run: |
          set -euo pipefail
          open_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number --jq 'length')"
          open_issues="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number --jq 'length')"
          test "$open_prs" -eq 0
          test "$open_issues" -eq 0

      - name: Delete merged and superseded branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feat/dynamic-profile-card"
            "feat/profile-identity-stats-v2"
            "feat/red-terminal-profile"
            "feat/use-uploaded-ascii-art"
            "feature/dynamic-profile-telemetry"
            "fix/profile-card-portability"
            "fix/profile-card-rendering-v2"
            "fix/profile-id-final-direct"
            "fix/profile-id-readme-v2-trigger"
            "fix/profile-id-readme-v2"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

          mapfile -t remaining < <(
            git ls-remote --heads origin |
              awk '{sub("refs/heads/", "", $2); print $2}' |
              sort
          )
          if [[ "${remaining[*]}" != "production" ]]; then
            printf 'Unexpected remaining branches: %s\n' "${remaining[*]}" >&2
            exit 1
          fi

      - name: Dispatch and verify the production profile workflow
        shell: bash
        run: |
          set -euo pipefail
          previous_id="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow profile-stats.yml \
              --branch production \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // 0'
          )"

          gh workflow run profile-stats.yml --repo "$GITHUB_REPOSITORY" --ref production

          run_id=""
          for _ in {1..30}; do
            candidate="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow profile-stats.yml \
                --branch production \
                --event workflow_dispatch \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // 0'
            )"
            if [[ "$candidate" != "0" && "$candidate" != "$previous_id" ]]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done

          if [[ -z "$run_id" ]]; then
            echo "The dispatched profile workflow run was not discovered." >&2
            exit 1
          fi

          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Remove this one-time cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin production
          git rebase origin/production
          git rm .github/workflows/repository-cleanup.yml
          git commit -m "chore: remove completed repository cleanup workflow"
          git push origin HEAD:production
