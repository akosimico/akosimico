name: Apply ASCII portrait replacement

on:
  workflow_dispatch:
  push:
    branches:
      - feat/replace-ascii-portrait-v2
    paths:
      - ".github/workflows/apply-ascii-portrait.yml"

permissions:
  contents: write

concurrency:
  group: apply-ascii-portrait-v2
  cancel-in-progress: false

