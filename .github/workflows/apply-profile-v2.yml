name: Apply profile ID v2

on:
  workflow_dispatch:
  push:
    branches:
      - production
    paths:
      - ".github/workflows/apply-profile-v2.yml"
      - ".profile-update/**"

permissions:
  contents: write

concurrency:
  group: apply-profile-id-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out production with history
        uses: actions/checkout@v6
        with:
          ref: production
          fetch-depth: 0

      - name: Apply verified profile update
        shell: bash
        run: |
          set -euo pipefail
          cat .profile-update/part{1,2,3,4,5}.b64 | base64 --decode > /tmp/profile-v2.patch.xz
          echo "b68071a4f78e4fa762a52e69498f2726ebef5a82365da561f94e2d2058276375  /tmp/profile-v2.patch.xz" | sha256sum --check
          xz --decompress --stdout /tmp/profile-v2.patch.xz > /tmp/profile-v2.patch
          git apply --index /tmp/profile-v2.patch
          git show 304add63ba84b8d60cc4cd82b912a865a931a6e9:assets/profile-banner.png > assets/profile-banner.png
          git add assets/profile-banner.png
          rm -rf .profile-update .github/workflows/apply-profile-v2.yml
          git add -A
          python -m unittest discover -s tests -v
          python -m compileall -q profile_generator tests
          git diff --check

      - name: Commit applied update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: finalize profile ID and repository statistics"
          git push origin HEAD:production
