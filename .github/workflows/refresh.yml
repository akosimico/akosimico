name: Refresh Profile Stats

on:
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight UTC
  workflow_dispatch: # allows manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip python-dotenv==1.1.1

      - name: Verify profile statistics credentials
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          PROFILE_LOGIN: akosimico
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PROFILE_STATS_TOKEN}" ]]; then
            echo "::error::PROFILE_STATS_TOKEN is not configured. Add a valid GitHub personal access token in Settings > Secrets and variables > Actions."
            exit 1
          fi

          if ! curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PROFILE_STATS_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user > "${RUNNER_TEMP}/profile-user.json"; then
            echo "::error::PROFILE_STATS_TOKEN was rejected by GitHub. Replace the repository secret with an active personal access token for ${PROFILE_LOGIN}."
            exit 1
          fi

          authenticated_login="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["login"])' "${RUNNER_TEMP}/profile-user.json")"
          if [[ "${authenticated_login,,}" != "${PROFILE_LOGIN,,}" ]]; then
            echo "::error::PROFILE_STATS_TOKEN belongs to ${authenticated_login}, but PROFILE_LOGIN is ${PROFILE_LOGIN}."
            exit 1
          fi

      - name: Generate profile assets
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          PROFILE_LOGIN: "akosimico"
          PROFILE_REQUIRED_OWNERS: "akosimico"
        run: python -m profile_generator

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ generated/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
