name: Remove final stale branch

on:
  workflow_dispatch:
  push:
    branches:
      - production
    paths:
      - ".github/workflows/delete-final-stale-branch.yml"

permissions:
  contents: write

concurrency:
  group: delete-final-stale-branch
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out production
        uses: actions/checkout@v6
        with:
          ref: production
          fetch-depth: 0

      - name: Delete stale branch and verify branch inventory
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "fix/profile-statistics-v3" >/dev/null 2>&1; then
            git push origin --delete "fix/profile-statistics-v3"
          fi
          mapfile -t remaining < <(
            git ls-remote --heads origin |
              awk '{sub("refs/heads/", "", $2); print $2}' |
              sort
          )
          if [[ "${remaining[*]}" != "production" ]]; then
            printf 'Unexpected remaining branches: %s\n' "${remaining[*]}" >&2
            exit 1
          fi

      - name: Remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/delete-final-stale-branch.yml
          git commit -m "chore: remove final branch cleanup workflow"
          git push origin HEAD:production
