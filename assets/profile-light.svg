<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="518" viewBox="0 0 1500 518" role="img" aria-labelledby="title desc">
<title id="title">Mico Helis GitHub profile identity and account statistics</title>
  <desc id="desc">Sidebar-style identity card with an embedded ASCII portrait and a spec-sheet listing of aggregate GitHub statistics.</desc>
  <defs>
    <linearGradient id="panel-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f4f1"/>
    </linearGradient>
    <linearGradient id="sidebar-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f0ea"/>
      <stop offset="1" stop-color="#f0f4f1"/>
    </linearGradient>
    <radialGradient id="accent-glow" cx="0.15" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#ccfbf1" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ccfbf1" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; white-space: pre; }
      .ascii { fill: #115e59; font-size: 5.8px; font-weight: 500; }
      .name { fill: #064e3b; font-size: 24px; font-weight: 700; }
      .section { fill: #047857; font-size: 14px; font-weight: 700; letter-spacing: 2px; }
      .key { fill: #475569; font-size: 17px; font-weight: 500; }
      .value { fill: #0f172a; font-size: 17px; font-weight: 600; }
      .positive { fill: #0f766e; font-weight: 700; }
      .negative { fill: #b91c1c; font-weight: 700; }
    </style>
  </defs>
  <rect width="1500" height="518" rx="22" fill="#f0f4f1"/>
  <rect x="10" y="10" width="1480" height="498" rx="18" fill="url(#panel-gradient)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Sidebar -->
  <path d="M 28 10 H 420 V 508 H 28 A 18 18 0 0 1 10 490 V 28 A 18 18 0 0 1 28 10 Z" fill="url(#sidebar-gradient)"/>
  <rect x="420" y="10" width="1" height="498" fill="#cbd5e1"/>
  <rect x="10" y="10" width="420" height="498" fill="url(#accent-glow)"/>

<text x="40" y="34"
      fill="#475569"
      font-size="14"
      font-family="Consolas, monospace">
$ python profile.py
</text>

